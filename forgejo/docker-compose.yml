services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: 999
      USER_GID: 986
      FORGEJO_CUSTOM: /etc/forgejo
      FORGEJO__database__PASSWD: ${FORGEJO__database__PASSWD}
    ports:
      - "22:2222"
    volumes:
      - ./config:/etc/forgejo
      - /var/opt/slapshit/forgejo/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - caddy
      - forgejo
    depends_on:
      - database

  database:
    image: postgres:18
    container_name: forgejo_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO__database__PASSWD}
      POSTGRES_DB: gitea
    volumes:
      - /var/opt/slapshit/forgejo/database:/var/lib/postgresql
    networks:
      - forgejo

networks:
  caddy:
    external: true

  forgejo:
    external: true
