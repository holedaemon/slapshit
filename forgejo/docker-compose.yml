services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: 999
      USER_GID: 986

      FORGEJO____APP_NAME: ${FORGEJO____APP_NAME}
      FORGEJO____APP_SLOGAN: ${FORGEJO____APP_SLOGAN}
      FORGEJO____RUN_USER: git
      FORGEJO____RUN_MODE: prod

      FORGEJO__server__PROTOCOL: http
      FORGEJO__server__DOMAIN: slapshit.net
      FORGEJO__server__ROOT_URL: https://slapshit.net
      FORGEJO__server__HTTP_PORT: "8080"
      FORGEJO__server__START_SSH_SERVER: true
      FORGEJO__server__SSH_LISTEN_PORT: "222"

      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo_database
      FORGEJO__database__NAME: gitea
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO__database__PASSWD}
      FORGEJO__database__SSL_MODE: disable

      FORGEJO__security__INSTALL_LOCK: true

      FORGEJO__service__DISABLE_REGISTRATION: true

      FORGJEO__repository__DISABLE_STARS: true
      FORGEJO__repository__DEFAULT_BRANCH: trunk

      FORGEJO__other__SHOW_FOOTER_VERSION: false
      FORGEJO__other__SHOW_FOOTER_TEMPLATE_LOAD_TIME: false
      FORGEJO__other__SHOW_FOOTER_POWERED_BY: false
    ports:
      - "22:222"
    volumes:
      - /var/opt/slapshit/forgejo/data:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - caddy
      - forgejo
    depends_on:
      - database

  database:
    image: postgres:18
    container_name: forgejo_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO__database__PASSWD}
      POSTGRES_DB: gitea
    volumes:
      - /var/opt/slapshit/forgejo/database:/var/lib/postgresql
    networks:
      - forgejo

networks:
  caddy:
    external: true

  forgejo:
    external: true
