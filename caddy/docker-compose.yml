services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "/srv/www:/srv"
      - "/etc/opt/slapshit/caddy:/etc/caddy"
      - "data:/data"
      - "config:/config"
    networks:
      - caddy

volumes:
  data:
  config:

networks:
  caddy:
    external: true
